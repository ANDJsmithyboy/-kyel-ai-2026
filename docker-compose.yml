services:
  nkyel-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nkyel-api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8001:8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
