services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nkyel-backend-prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - RELEASE_VERSION=1.0.0-rc1
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED:-${DATABASE_URL}}
      - NEON_DATABASE_URL=${NEON_DATABASE_URL:-${DATABASE_URL}}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY}
      - RUNPOD_GPT_OSS_BASE_URL=${RUNPOD_GPT_OSS_BASE_URL:-https://api.runpod.ai/v2/gpt-oss-120b/openai/v1}
      - RUNPOD_GPT_OSS_MODEL=${RUNPOD_GPT_OSS_MODEL:-openai/gpt-oss-120b}
      - RUNPOD_QWEN_BASE_URL=${RUNPOD_QWEN_BASE_URL:-https://api.runpod.ai/v2/qwen3-32b-awq/openai/v1}
      - RUNPOD_QWEN_MODEL=${RUNPOD_QWEN_MODEL:-Qwen/Qwen3-32B-AWQ}
      - PRIMARY_INFERENCE_PROVIDER=${PRIMARY_INFERENCE_PROVIDER:-runpod_gpt_oss}
      - SECONDARY_INFERENCE_PROVIDER=${SECONDARY_INFERENCE_PROVIDER:-runpod_qwen}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEYS=${GROQ_API_KEYS}
      - AURATA_MODEL=${AURATA_MODEL:-llama-3.3-70b-versatile}
      - SONAR_MODEL=${SONAR_MODEL:-llama-3.1-8b-instant}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_R2_BUCKET=${CLOUDFLARE_R2_BUCKET}
      - CLOUDFLARE_R2_PUBLIC_DOMAIN=${CLOUDFLARE_R2_PUBLIC_DOMAIN}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - TAVILY_API_KEYS=${TAVILY_API_KEYS}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-${GOOGLE_API_KEY}}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - CLERK_ISSUER=${CLERK_ISSUER:-https://clerk.smartandjai.com}
      - CLERK_FRONTEND_API_URL=${CLERK_FRONTEND_API_URL:-https://clerk.smartandjai.com}
      - CLERK_AUTHORIZED_PARTIES=${CLERK_AUTHORIZED_PARTIES:-https://nkyel.smartandjai.com,https://demo.nkyel.smartandjai.com,https://nkyel-fd.vercel.app,http://localhost:3000}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - DEERFLOW_URL=http://deerflow:8080
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - REDIS_URL=${REDIS_URL}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
    depends_on:
      deerflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  deerflow:
    build:
      context: ./backend
      dockerfile: Dockerfile.deerflow
    container_name: nkyel-deerflow-prod
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - RUNPOD_API_KEY=${RUNPOD_API_KEY}
      - RUNPOD_GPT_OSS_BASE_URL=${RUNPOD_GPT_OSS_BASE_URL:-https://api.runpod.ai/v2/gpt-oss-120b/openai/v1}
      - RUNPOD_GPT_OSS_MODEL=${RUNPOD_GPT_OSS_MODEL:-openai/gpt-oss-120b}
      - RUNPOD_QWEN_BASE_URL=${RUNPOD_QWEN_BASE_URL:-https://api.runpod.ai/v2/qwen3-32b-awq/openai/v1}
      - RUNPOD_QWEN_MODEL=${RUNPOD_QWEN_MODEL:-Qwen/Qwen3-32B-AWQ}
      - PRIMARY_INFERENCE_PROVIDER=${PRIMARY_INFERENCE_PROVIDER:-runpod_gpt_oss}
      - SECONDARY_INFERENCE_PROVIDER=${SECONDARY_INFERENCE_PROVIDER:-runpod_qwen}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEYS=${GROQ_API_KEYS}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - TAVILY_API_KEYS=${TAVILY_API_KEYS}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-${GOOGLE_API_KEY}}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED:-${DATABASE_URL}}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    profiles:
      - frontend
    build:
      context: ./nkyel-fd-main
      dockerfile: Dockerfile
    container_name: nkyel-frontend-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-${CLERK_PUBLISHABLE_KEY:-}}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
